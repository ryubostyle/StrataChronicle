name: StrataChronicle Pilgrimage Circulation

on:
  push:
    branches:
      - main
    paths:
      - 'Film/**'
      - 'architecture.yml'
      - 'build_sanctuaries.py'
      - 'Generator/**'
  workflow_dispatch: # 手動トリガーによる聖域の巡礼

permissions:
  contents: write

jobs:
  pilgrimage_cycle:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 4. Build Sanctuaries & Sync main.py
        run: python build_sanctuaries.py

      - name: 5. Ignite Pilgrimage Engine (Run Dynamic Metabolism)
        run: |
          # 4つの聖域を巡る巡礼パイプライン（main.py経由での駆動）
          python main.py

      - name: 6. Auto-Commit & Push Crystallized Strata
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "🎬 [StrataChronicle] Autonomous pilgrimage & archive crystallization"
            git push
          else
            echo "✨ 変更差分がないため、コミットをスキップしました。"
          fi
