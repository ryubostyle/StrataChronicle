name: StrataChronicle Dynamic Circulation

on:
  push:
    branches:
      - main
    paths:
      - 'Film/**'
      - 'architecture.yml'
      - 'build_sanctuaries.py'
      - 'Generator/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  circulate-strata:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: 4. Build Sanctuaries & Sync main.py
        run: python build_sanctuaries.py

      - name: 5. Run Dynamic Metabolism Pipeline
        run: python main.py

      - name: 6. Auto-Commit & Push Crystallized Strata
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "🎬 [StrataChronicle] Autonomous circulation & archive crystallization"
            git push
          else
            echo "✨ 変更差分がないため、コミットをスキップしました。"
          fi
