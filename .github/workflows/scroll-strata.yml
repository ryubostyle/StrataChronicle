name: StrataChronicle Cloud Metabolism

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  metabolism:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Materialize Sanctuaries & Run Bootstrap
        run: |
          python build_sanctuaries.py

      - name: Execute Metabolism
        run: |
          if [ -f main.py ]; then
            python main.py
          fi

      - name: Commit and Push Strata Crystallization
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 💡 プッシュ前の安全装置：リモートの変更を先に取り込んで競合を回避
          git pull --rebase origin main || echo "No rebase needed"
          
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "💎 [Cloud Metabolism] Cinematic sweep & crystallization"
          git push origin main
