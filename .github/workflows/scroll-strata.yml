name: StrataChronicle Dynamic Circulation

on:
  push:
    branches:
      - main
    paths:
      - 'Film/**'
      - 'architecture.yml'
      - 'build_sanctuaries.py'
      - 'Generator/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  circulate-strata:
    runs-on: ubuntu-latest
    # 自動コミット自身による無限ループを確実に防止
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: 4. Build Sanctuaries & Sync main.py
        run: python build_sanctuaries.py

      - name: 5. Run Dynamic Metabolism Pipeline
        run: python main.py

      - name: 6. Auto-Commit & Push Crystallized Strata
        uses: endbug/git-auto-commit@v5
        with:
          commit_message: "🎬 [StrataChronicle] Autonomous circulation & archive crystallization"
          branch: main
