# architecture.yml
# StrataChronicle システムの位相トポロジおよび基本設計図（Single Source of Truth）

system: "StrataChronicle"
version: "2.0.0"
timezone: "Asia/Tokyo"  # ← 追加
sanctuaries:
  - name: "Film"
    next: "Projector"
    role: "Raw draft intake & script binding"
  - name: "Projector"
    next: "Screen"
    role: "Scene structuring & optical projection"
  - name: "Screen"
    next: "Theater"
    role: "Visual formatting & master print"
  - name: "Theater"
    next: null
    role: "Permanent archive & final screening"

# 【オプション】各聖域のGeneratorのデフォルト挙動を上書きしたい場合のみ記述します
